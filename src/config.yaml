site:
  name: "Vaani"
  site: "https://vaani.drblank.dev"
  base: "/" # Keep this unless deploying to a subfolder (not the case for you)
  trailingSlash: false # Keep as is, AstroWind default

  # googleSiteVerificationId: null # Add your ID later if you use Google Search Console

# Default SEO metadata
metadata:
  title:
    default: "Vaani - Beautiful & Fast Audiobookshelf Client"
    template: "%s — Vaani"
  description: "Vaani is a beautiful, fast, and functional open-source Android client for your self-hosted Audiobookshelf server. Enjoy offline listening, playback control, and Material Design." # CHANGE THIS - Your concise site description
  github: "https://github.com/Dr-Blank/Vaani"
  robots:
    index: true
    follow: true
  openGraph: # Used for social media previews
    site_name: "Vaani Audiobook Player"
    images:
      # IMPORTANT: Replace default.png later with your own social sharing image
      - url: "~/assets/images/vaani-og-image.png" # CHANGE to your OG image path later
        width: 656
        height: 328
    type: website
  # twitter:
    
    # handle: "@YourTwitterHandle" # Optional: Add your Twitter handle if you have one
    # site: "@YourTwitterHandle" # Optional: Add your Twitter handle if you have one
    # cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    # IMPORTANT: Disable the blog unless you plan to have one
    isEnabled: false # CHANGE THIS to false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: "/%slug%" # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: false
      pathname: "blog" # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: "category" # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: "tag" # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: "system" # 'system' respects user OS preference (light/dark). You can force 'light' or 'dark'.
